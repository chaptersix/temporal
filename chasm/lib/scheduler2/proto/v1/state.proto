syntax = "proto3";

package temporal.server.chasm.lib.scheduler2.proto.v1;

import "google/protobuf/timestamp.proto";
import "temporal/api/common/v1/message.proto";
import "temporal/api/sdk/v1/user_metadata.proto";
import "temporal/api/enums/v1/schedule.proto";
import "temporal/api/schedule/v1/message.proto";

option go_package = "go.temporal.io/server/chasm/lib/scheduler2/gen/scheduler2pb/v1;scheduler2pb";

// RootState holds the bounded scheduler control summary.
message RootState {
  // Incarnation is the execution run ID.
  string incarnation = 1;
  // Revision identifies the current definition.
  int64 revision = 2;
  // Cursor is the last disposed nominal Unix nanosecond.
  int64 cursor = 3;
  // Paused prevents automatic admission; manual commands remain eligible.
  bool paused = 4;
  // Limited enables the remaining action budget.
  bool limited = 5;
  // Remaining counts automatic admissions available.
  int64 remaining = 6;
  // Started counts operations with evidence of acceptance.
  int64 started = 7;
  // OperationId identifies the latest admitted operation.
  string operation_id = 8;
  // CarryoverSet indicates that a separate carryover node has been initialized.
  bool carryover_set = 9;
  // PauseOnFailure applies the current policy to failed or timed-out completions.
  bool pause_on_failure = 10;
  // HasGenerator indicates that the separate generation component is initialized.
  bool has_generator = 11;
  // Policy applies to newly arriving automatic occurrences.
  temporal.api.enums.v1.ScheduleOverlapPolicy policy = 12;
  // Queue holds waiting occurrence identities without payloads: the internal profile caps four;
  // public configured capacity may retain a larger backlog pending WI-018 indexed storage.
  repeated QueuedOccurrence queue = 13;
  // BufferDropped counts automatic arrivals rejected by the bounded buffer policy.
  int64 buffer_dropped = 14;
  // DrainToken identifies the current independent drain obligation.
  uint64 drain_token = 15;
  // DrainArmed indicates queued work can progress without external completion.
  bool drain_armed = 16;
  // DrainAt is the execution Unix nanosecond deadline for draining.
  int64 drain_at = 17;
  // Unfinished counts operation intents that cannot yet be reclaimed.
  int64 unfinished = 18;
  // BlockingOperationId identifies the one non-ALLOW_ALL overlap owner.
  string blocking_operation_id = 19;
  // CapacityDropped counts new automatic arrivals dropped at operation capacity.
  int64 capacity_dropped = 20;
  // PendingStarts validates start tasks without loading operation records. The finite internal
  // profile is bounded; public backlog-sized tasks await the WI-018 dispatcher conversion.
  map<string, int64> pending_starts = 21;
  // OverlapSuperseded counts unadmitted selected candidates replaced by overlap policy.
  int64 overlap_superseded = 22;
  // Effects holds at most cancel and terminate metadata for the current blocker.
  repeated EffectState effects = 23;
  // ManualSequence never reuses an accepted command occurrence identity.
  uint64 manual_sequence = 24;
  // Manuals holds pending manual commands: internal limit four, public combined command limit 100.
  repeated ManualCommand manuals = 25;
  // ManualToken identifies the current transfer obligation.
  uint64 manual_token = 26;
  // ManualArmed indicates pending commands can make internal progress.
  bool manual_armed = 27;
  // ManualAt is the execution-clock transfer deadline.
  int64 manual_at = 28;
  // Coordination owns the sole scan/admission obligation and resource turns.
  CoordinationState coordination = 29;
  // BackfillSequence uniquely identifies accepted ranges in this incarnation.
  uint64 backfill_sequence = 30;
  // Backfills holds range continuations: internal limit four, public combined command limit 100.
  repeated BackfillState backfills = 31;
  // BackfillFocus pins a request while its ready candidate waits for handoff.
  uint64 backfill_focus = 32;
  // LastBackfill remembers the last serviced request for cyclic selection.
  uint64 last_backfill = 33;
  // Closed revokes scheduling authority while retaining historical state.
  bool closed = 34;
  // ActivitySet distinguishes an observed zero timestamp from no anchor.
  bool activity_set = 35;
  // ActivityAt is the monotonic execution-clock activity anchor.
  int64 activity_at = 36;
  // UnconfirmedStarts counts Pending and Ambiguous operation intents.
  int64 unconfirmed_starts = 37;
  // IdleDuration is the configured inactivity retention in nanoseconds; zero disables it.
  int64 idle_duration = 38;
  // IdleToken fences the current idle-close obligation.
  uint64 idle_token = 39;
  // IdleArmed indicates a published idle-close obligation.
  bool idle_armed = 40;
  // IdleAt is the exact execution-clock idle deadline.
  int64 idle_at = 41;
  // PublicRevision fences public mutations independently of definition revisions; zero denotes an internal root.
  uint64 public_revision = 42;
  // PublicActionRef owns the immutable payload bundle for the current public action.
  string public_action_ref = 43;
}

// Phase distinguishes an operation's durable progress from delivery attempts.
enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_PENDING = 1;
  PHASE_STARTED = 2;
  PHASE_COMPLETED = 3;
  PHASE_AMBIGUOUS = 4;
  // StartOnly settles an untracked start intent without claiming workflow completion.
  PHASE_START_ONLY = 5;
}

// OperationState holds metadata without decoding request payloads.
message OperationState {
  // OccurrenceId identifies an automatic nominal time or a manual command sequence.
  string occurrence_id = 1;
  // ActionId identifies the one-time admission.
  string action_id = 2;
  // Id is the immutable external request identity.
  string id = 3;
  // ChainId is the first accepted workflow run ID.
  string chain_id = 4;
  // Nominal is the occurrence's Unix nanosecond.
  int64 nominal = 5;
  // Deadline is the exclusive issuance deadline in execution Unix nanoseconds.
  int64 deadline = 6;
  // RetryAt is the next issuance time in execution Unix nanoseconds.
  int64 retry_at = 7;
  // Phase is the durable progress of the operation.
  Phase phase = 8;
  // WorkflowId preserves queue-time workflow identity independently of the request.
  string workflow_id = 9;
  // Policy is the immutable resolved admission policy.
  temporal.api.enums.v1.ScheduleOverlapPolicy policy = 10;
  // ManualId is zero for automatic occurrences and the command sequence otherwise.
  uint64 manual_id = 11;
  // BackfillId distinguishes a range occurrence from a manual trigger.
  uint64 backfill_id = 12;
  // StartObserved records the first matching successful RPC observation.
  bool start_observed = 13;
  // StartObservedAt is wall observation plus the issuance snapshot skipped duration.
  int64 start_observed_at = 14;
 // nominal_time preserves seconds and nanoseconds when the legacy int64 field cannot represent the instant.
 google.protobuf.Timestamp nominal_time = 15;
}

// Payload keeps large values on a separately loaded node.
message Payload {
  // Data is an immutable serialized request or synthetic diagnostic payload.
  bytes data = 1;
  // ActionRef identifies the immutable action payload bundle.
  string action_ref = 2;
  // ResultRef identifies the immutable last completion result.
  string result_ref = 3;
  // FailureRef identifies the immutable continued failure.
  string failure_ref = 4;
}

// ActionPayloadBundle shares large action fields across public and issuance envelopes.
message ActionPayloadBundle {
  // Input preserves absent and allocated-empty input wrappers.
  temporal.api.common.v1.Payloads input = 1;
  // Header contains user workflow headers.
  temporal.api.common.v1.Header header = 2;
  // Memo contains user workflow memo.
  temporal.api.common.v1.Memo memo = 3;
  // UserSearchAttributes excludes generated per-admission attributes.
  temporal.api.common.v1.SearchAttributes user_search_attributes = 4;
  // UserMetadata contains workflow summary and details.
  temporal.api.sdk.v1.UserMetadata user_metadata = 5;
}

// StartTask drives a committed operation and survives physical redelivery.
message StartTask {
  // OperationId identifies the durable request.
  string operation_id = 1;
  // Exact logical wake in Unix nanoseconds; physical queue timestamps may shift.
  int64 wake_time = 2;
}

// CarryoverState retains opaque completion values separately from control metadata.
message CarryoverState {
  // Result is a serialized Payload; empty bytes represent an absent result.
  bytes result = 1;
  // Failure is a serialized Failure from the last failure outcome.
  bytes failure = 2;
  // FailurePresent distinguishes an empty failure message from absence.
  bool failure_present = 3;
  // ResultRef identifies the immutable successful result bytes.
  string result_ref = 4;
  // FailureRef identifies the immutable failure bytes.
  string failure_ref = 5;
}

// EnumerationStatus distinguishes work stops from complete source exhaustion.
enum EnumerationStatus {
  ENUMERATION_STATUS_UNSPECIFIED = 0;
  ENUMERATION_STATUS_ACTIVE = 1;
  ENUMERATION_STATUS_YIELD = 2;
  ENUMERATION_STATUS_LIMITED = 3;
  ENUMERATION_STATUS_WAITING = 4;
  ENUMERATION_STATUS_EMPTY = 5;
  ENUMERATION_STATUS_IMPOSSIBLE = 6;
  ENUMERATION_STATUS_EXHAUSTED = 7;
}

// OccurrenceCandidate retains a discovered value across time and work boundaries.
message OccurrenceCandidate {
  // Nominal is the identity's execution Unix nanoseconds.
  int64 nominal = 1;
  // Actual is the jittered execution Unix nanoseconds.
  int64 actual = 2;
  // Revision identifies its immutable definition.
  int64 revision = 3;
  // Excluded records an exclusion awaiting disposition.
  bool excluded = 4;
 // nominal_time preserves seconds and nanoseconds when the legacy int64 field cannot represent the instant.
 google.protobuf.Timestamp nominal_time = 5;
 // actual_time preserves seconds and nanoseconds when the legacy int64 field cannot represent the instant.
 google.protobuf.Timestamp actual_time = 6;
}

// OccurrenceContinuation stores resumable search separately from generator tokens.
message OccurrenceContinuation {
  // Origin is the initial exclusive boundary in execution Unix nanoseconds.
  int64 origin = 1;
  // DefinitionId binds the canonical definition and jitter seed.
  string definition_id = 2;
  // Revision identifies the immutable definition.
  int64 revision = 3;
  // SearchAfter is the last examined nominal boundary.
  int64 search_after = 4;
  // DisposedThrough is the last committed nominal disposition boundary.
  int64 disposed_through = 5;
  // Pending retains a candidate not yet disposed.
  OccurrenceCandidate pending = 6;
  // FullRange identifies scans beginning before the effective lower bound.
  bool full_range = 7;
  // EligibleSeen records whether any eligible value was found.
  bool eligible_seen = 8;
  // Terminal caches source completion independently of work stops.
  EnumerationStatus terminal = 9;
 // origin_time preserves seconds and nanoseconds when the legacy int64 field cannot represent the instant.
 google.protobuf.Timestamp origin_time = 10;
 // search_after_time preserves seconds and nanoseconds when the legacy int64 field cannot represent the instant.
 google.protobuf.Timestamp search_after_time = 11;
 // disposed_through_time preserves seconds and nanoseconds when the legacy int64 field cannot represent the instant.
 google.protobuf.Timestamp disposed_through_time = 12;
}

// GeneratorState holds bounded control state for generation.
message GeneratorState {
  // Continuation is the committed occurrence progress.
  OccurrenceContinuation continuation = 1;
  // Token distinguishes successive generation obligations.
  uint64 token = 2;
  // Armed indicates a current generation obligation.
  bool armed = 3;
  // WakeAt is its execution Unix nanosecond deadline.
  int64 wake_at = 4;
  // CatchupWindow is the permitted actual-time lateness in nanoseconds.
  int64 catchup_window = 5;
  // LastStatus is the most recent enumeration stop.
  EnumerationStatus last_status = 6;
  // Superseded records the last pending candidate discarded by a definition update.
  OccurrenceCandidate superseded = 7;
}

// GenerationDefinition holds immutable large values separate from generator metadata.
message GenerationDefinition {
  // Spec is a serialized ScheduleSpec.
  bytes spec = 1;
  // Seed fixes jitter choices for this revision.
  string seed = 2;
  // Request is the serialized workflow start template.
  bytes request = 3;
  // ActionRef identifies the shared action payload bundle.
  string action_ref = 4;
}

// GenerateTask identifies the current generation obligation.
message GenerateTask {
  // Token rejects replaced physical deliveries without advancing the cursor.
  uint64 token = 1;
}

// QueuedOccurrence retains identity while admission inputs remain unfrozen.
message QueuedOccurrence {
  // Nominal is the automatic occurrence identity in Unix nanoseconds.
  int64 nominal = 1;
  // Actual is its jittered due time in Unix nanoseconds.
  int64 actual = 2;
  // WorkflowId is the fully suffixed queue-time workflow identity.
  string workflow_id = 3;
  // Policy is resolved when the occurrence enters the queue.
  temporal.api.enums.v1.ScheduleOverlapPolicy policy = 4;
  // ManualId preserves command identity through delayed admission.
  uint64 manual_id = 5;
  // BackfillId identifies the accepted range that owns this nominal occurrence.
  uint64 backfill_id = 6;
 // nominal_time preserves seconds and nanoseconds when the legacy int64 field cannot represent the instant.
 google.protobuf.Timestamp nominal_time = 7;
 // actual_time preserves seconds and nanoseconds when the legacy int64 field cannot represent the instant.
 google.protobuf.Timestamp actual_time = 8;
}

// DrainTask drives an independent bounded queue admission step.
message DrainTask {
  // Token rejects stale physical drain deliveries.
  uint64 token = 1;
}

// EffectKind identifies the separately fenced overlap RPC.
enum EffectKind {
  EFFECT_KIND_UNSPECIFIED = 0;
  EFFECT_KIND_CANCEL = 1;
  EFFECT_KIND_TERMINATE = 2;
}

// EffectPhase separates unknown acceptance from settled retry obligations.
enum EffectPhase {
  EFFECT_PHASE_UNSPECIFIED = 0;
  EFFECT_PHASE_AWAITING_TARGET = 1;
  EFFECT_PHASE_PENDING = 2;
  EFFECT_PHASE_ACCEPTED = 3;
  EFFECT_PHASE_ABSENT = 4;
  EFFECT_PHASE_AMBIGUOUS = 5;
  EFFECT_PHASE_SUPERSEDED = 6;
}

// EffectState holds small control values without preparing the frozen request.
message EffectState {
  // Id is the target operation ID plus the effect kind suffix.
  string id = 1;
  // TargetId identifies the immutable tracked start intent.
  string target_id = 2;
  // Kind selects cancel or terminate.
  EffectKind kind = 3;
  // Phase controls issuance without implying workflow completion.
  EffectPhase phase = 4;
  // ChainId is the immutable first-run fence, empty while awaiting evidence.
  string chain_id = 5;
  // Deadline is the exclusive execution-time retry horizon in Unix nanoseconds.
  int64 deadline = 6;
  // RetryAt is the next issuance deadline in Unix nanoseconds.
  int64 retry_at = 7;
}

// EffectTask drives a separately identified overlap RPC intent.
message EffectTask {
  // EffectId identifies the immutable cancel or terminate request.
  string effect_id = 1;
  // Exact logical wake in Unix nanoseconds; physical queue timestamps may shift.
  int64 wake_time = 2;
}

// ManualCommand is payload-free accepted ingress awaiting execution capacity.
message ManualCommand {
 // Id is the per-incarnation acceptance sequence.
 uint64 id = 1;
 // Nominal is the supplied workflow identity time, not a dispatch deadline.
 int64 nominal = 2;
 // Policy is the override, resolved when transferred to the execution queue.
 temporal.api.enums.v1.ScheduleOverlapPolicy policy = 3;
 // nominal_time preserves seconds and nanoseconds when the legacy int64 field cannot represent the instant.
 google.protobuf.Timestamp nominal_time = 4;
}
// ManualTask transfers one accepted command without external polling.
message ManualTask {
 // Token fences superseded logical transfer obligations.
 uint64 token = 1;
}

// WorkClass identifies a coordinator service class, not an executor.
enum WorkClass {
 WORK_CLASS_UNSPECIFIED = 0;
 WORK_CLASS_DRAIN = 1;
 WORK_CLASS_MANUAL = 2;
 WORK_CLASS_BACKFILL = 3;
 WORK_CLASS_AUTOMATIC = 4;
}
// CoordinationState persists task fencing separately from resource entitlement.
message CoordinationState {
 // Token fences superseded coordinator tasks.
 uint64 token = 1;
 // Armed indicates an internal or timed obligation.
 bool armed = 2;
 // At is the execution-clock deadline.
 int64 at = 3;
 // NextWork controls bounded scan/service selection.
 WorkClass next_work = 4;
 // NextQueue chooses the next vacancy contender.
 WorkClass next_queue = 5;
 // NextOperation chooses the next operation-slot contender.
 WorkClass next_operation = 6;
 // OwnerClass identifies the holder of the one vacancy reservation.
 WorkClass owner_class = 7;
 // OwnerKey is empty when no vacancy is reserved.
 string owner_key = 8;
}
// WorkTask drives the sole coordinator obligation.
message WorkTask {
 // Token is the persisted task generation.
 uint64 token = 1;
 // RemainingQuanta bounds an immediate pure-task chain; physical tasks use zero.
 uint32 remaining_quanta = 2;
}
// BackfillState holds bounded current-definition range progress without payloads.
message BackfillState {
 // Id is the unique accepted request sequence.
 uint64 id = 1;
 // Start is the inclusive lower nominal bound in Unix nanoseconds.
 int64 start = 2;
 // End is the inclusive upper actual-time bound, immutable after acceptance.
 int64 end = 3;
 // Policy is an override resolved at candidate transfer.
 temporal.api.enums.v1.ScheduleOverlapPolicy policy = 4;
 // Continuation retains search, disposition and pending candidate separately.
 OccurrenceContinuation continuation = 5;
 // SkipBatchRemaining preserves same-batch overlap decisions across callbacks.
 int64 skip_batch_remaining = 6;
 // SkipBatchRevision fences a group when the current definition is rebased.
 int64 skip_batch_revision = 7;
 // start_time preserves seconds and nanoseconds when the legacy int64 field cannot represent the instant.
 google.protobuf.Timestamp start_time = 8;
 // end_time preserves seconds and nanoseconds when the legacy int64 field cannot represent the instant.
 google.protobuf.Timestamp end_time = 9;
}

// IdleTask checks the current idle-close token and deadline.
message IdleTask {
  // Token identifies the published idle obligation.
  uint64 token = 1;
}

// PublicRuntime retains compact lifecycle metadata independently of payload retention.
message PublicRuntime {
  // Actions retains active intents and the ten most recent acknowledged starts.
  repeated PublicAction actions = 1;
  // MissedCatchupWindow counts eligible automatic occurrences disposed too late.
  int64 missed_catchup_window = 2;
  // OverlapSkipped counts occurrences disposed by SKIP while another action blocks.
  int64 overlap_skipped = 3;
  // CompletedOperations retains the ten latest tracked completions by workflow close time.
  repeated PublicCompletedOperation completed_operations = 4;
}
// PublicAction ties a public result to its immutable admitted operation.
message PublicAction {
  // OperationId is the immutable start request identity.
  string operation_id = 1;
  // Result carries actual response run identity, scheduled time and observation time.
  temporal.api.schedule.v1.ScheduleActionResult result = 2;
}

// PublicCompletedOperation records buffer occupancy independently of recent start display.
message PublicCompletedOperation {
  string operation_id = 1;
  google.protobuf.Timestamp close_time = 2;
}

// CalendarPreparationState owns one unselected calendar preparation revision.
message CalendarPreparationState {
  int64 revision = 1;
  bytes source_id = 2;
  // Exactly seven counts, ordered second/minute/hour/day/month/weekday/year.
  repeated uint32 range_counts = 3;
  uint64 installed_pages = 4;
  uint64 total_pages = 5;
  CalendarPreparationCursor cursor = 6;
  // Monotone FIFO ordinals; count equals tail minus head.
  uint64 cleanup_head = 7;
  uint64 cleanup_tail = 8;
  uint64 cleanup_count = 9;
}

// CalendarPreparationCursor is the durable value-only mask compiler continuation.
message CalendarPreparationCursor {
  bytes source_id = 1;
  uint32 field = 2;
  uint32 range = 3;
  int32 next = 4;
  bool in_range = 5;
  // Exactly six fixed field masks and two explicit-year mask words.
  repeated uint64 field_masks = 6;
  repeated uint64 year_masks = 7;
  bool all_years = 8;
  bool done = 9;
}

message CalendarPreparationRange {
  int32 start = 1;
  int32 end = 2;
  int32 step = 3;
}

// CalendarPreparationPage contains at most sixteen canonical range values.
message CalendarPreparationPage {
  bytes source_id = 1;
  uint32 field = 2;
  uint32 page = 3;
  repeated CalendarPreparationRange ranges = 4;
}

// CalendarSupersededSource owns exactly the installed prefix of an old source.
message CalendarSupersededSource {
  bytes source_id = 1;
  repeated uint32 range_counts = 2;
  uint64 installed_pages = 3;
  uint64 cursor = 4;
}
