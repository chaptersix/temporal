name: Property Test Soak

# The per-PR Property test job runs 1000 checks so it stays cheap
# enough to gate on. This workflow is where the input space actually gets
# explored: the same tests, same single attempt, but orders of magnitude more
# generated cases, on a fresh random seed each night.
#
# It is deliberately NOT a required check. A soak finding is a real bug, but it
# is found on an input no PR introduced, so it should not block unrelated merges.
# When it fails, download the counterexample artifact to reproduce the case
# locally, then pin it as a hand-written deterministic test. The fail files are
# gitignored rather than committed, because they replay a raw draw sequence and
# stop reproducing silently once a generator changes.

on:
  schedule:
    # Runs at 0600 UTC daily (night in the US), before the other daily jobs.
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual trigger
    inputs:
      rapid_checks:
        description: Number of generated cases per property
        required: false
        default: "100000"

permissions:
  contents: read

concurrency:
  group: property-test-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    name: Property test soak
    runs-on: ubuntu-24.04-arm
    env:
      RAPID_CHECKS: ${{ inputs.rapid_checks || '100000' }}
      TEST_TIMEOUT: 50m
      GITHUB_TIMEOUT: 60
      # Single attempt, as in the per-PR job: a retry would re-draw the seed and
      # discard the counterexample the soak exists to find.
      MAX_TEST_ATTEMPTS: 1
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Go
        uses: ./.github/actions/prepare-go

      - name: Run property test soak
        timeout-minutes: ${{ fromJSON(env.GITHUB_TIMEOUT) }}
        run: |
          echo "::notice::Soaking with RAPID_CHECKS=$RAPID_CHECKS"
          export TEST_RUNNER_TIMEOUT="$(("$GITHUB_TIMEOUT" - 1))m"
          ./develop/github/monitor_test.sh make property-test-coverage

      - name: Upload property test counterexamples
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: property-test-soak-counterexamples
          path: "**/testdata/rapid/**/*.fail"
          if-no-files-found: ignore

      - name: Post-test reporting
        if: always()
        uses: ./.github/actions/post-test-reporting
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          job_name: Property test soak
          artifact_name_suffix: property-test-soak
